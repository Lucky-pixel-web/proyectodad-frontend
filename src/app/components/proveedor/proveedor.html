<app-header></app-header>
<div class="page-shell">
  <div class="page-header">
    <div>
      <h1 class="page-title">Gestión de Proveedores</h1>
      <p class="page-subtitle">Administre el directorio de proveedores</p>
    </div>
    <button class="btn-primary-dark" (click)="abrirModalCrear()">+ Agregar Proveedor</button>
  </div>

  <div class="toolbar-row">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar por nombre o descripción..." [value]="busqueda" (input)="busqueda = $any($event.target).value" (keyup.enter)="filtrar()" />
    </div>
    <button type="button" class="btn-search" (click)="filtrar()">Buscar</button>
  </div>

  <div class="cards-grid" *ngIf="proveedores.length > 0">
    <div class="item-card" *ngFor="let p of proveedores; let i = index">
      <div class="item-card-header">
        <h3 class="item-card-title">{{ getNombreCompleto(p) }}</h3>
        <span class="badge-status" [ngClass]="getCatClass(p.categoriaNombre)">{{ p.categoriaNombre }}</span>
      </div>
      <div class="item-card-body">
        <div class="card-image-hero" *ngIf="p.foto"><img [src]="p.foto" alt="Foto proveedor" /></div>
        <div class="item-card-meta">
          <span>📞 {{ p.telefono }}</span>
          <span>📍 {{ p.direccion }}</span>
          <p>{{ p.descripcion }}</p>
        </div>
        <app-maps-planet [query]="p.ubicacion || p.direccion || ''" label="Ver ubicación" />
      </div>
      <div class="item-card-footer">
        <button class="btn-outline btn-icon" (click)="abrirModalEditar(p)">✏️ Editar</button>
        <button class="btn-danger-soft btn-icon" (click)="eliminar(p.id!)">🗑️ Eliminar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="cerrarModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ isEditMode ? 'Editar Proveedor' : 'Agregar Nuevo Proveedor' }}</h3>
      <button type="button" class="modal-close" (click)="cerrarModal()">✕</button>
    </div>
    
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="modal-body">
        <div class="alert-error" *ngIf="formError">{{ formError }}</div>
        
        <div class="form-grid">
          <div class="form-group"><label>Nombres <span class="req">*</span></label><input class="form-control-custom" formControlName="nombres" /></div>
          <div class="form-group"><label>Apellidos <span class="req">*</span></label><input class="form-control-custom" formControlName="apellidos" /></div>
          <div class="form-group"><label>Teléfono <span class="req">*</span></label><input type="number" class="form-control-custom" formControlName="telefono" /></div>
          
          <div class="form-group">
            <label>Categoría <span class="req">*</span></label>
            <select class="form-control-custom" formControlName="categoriaId">
              <option [ngValue]="null" disabled>Seleccione...</option>
              <option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nombre }}</option>
            </select>
          </div>

          <div class="form-group full"><label>Dirección <span class="req">*</span></label><input class="form-control-custom" formControlName="direccion" /></div>
          <div class="form-group full"><label>Ubicación <span class="req">*</span></label><input class="form-control-custom" formControlName="ubicacion" /></div>
          
          <div class="form-group full">
            <label>Imagen del Proveedor</label>
            <div class="file-upload-row">
              <label class="btn-file">📁 Seleccionar archivo
                <input type="file" accept="image/*" hidden (change)="onFotoSelected($event)" />
              </label>
              <span class="file-name" *ngIf="fotoNombre">{{ fotoNombre }}</span>
            </div>
            <div class="image-preview-panel" *ngIf="fotoPreview">
              <img [src]="fotoPreview" alt="Preview" />
            </div>
          </div>
          
          <div class="form-group full"><label>Descripción <span class="req">*</span></label><textarea class="form-control-custom" rows="3" formControlName="descripcion"></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outline" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-primary-dark">Guardar</button>
      </div>
    </form>
  </div>
</div>
